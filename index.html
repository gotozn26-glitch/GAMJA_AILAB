<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF000" />
    <title>GAMJAS AI LAB — 리뉴얼 중</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: #000;
        font-family: 'Noto Sans KR', Inter, system-ui, sans-serif;
      }

      main {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        font-size: clamp(2rem, 8vw, 4rem);
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1.1;
      }

      p {
        margin-top: 1rem;
        font-size: clamp(1rem, 3vw, 1.25rem);
        font-weight: 500;
        color: #333;
        line-height: 1.6;
      }

      .thanks {
        margin-top: 0.75rem;
        font-size: clamp(0.9375rem, 2.5vw, 1.125rem);
        color: #555;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>리뉴얼 중</h1>
      <p>GAMJAS AI LAB을 새롭게 준비하고 있습니다.</p>
      <p class="thanks">관심과 사랑에 감사드립니다.</p>
    </main>
  </body>
</html>
